<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tractors for Sale – TractorBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a href="/">🚜 TractorBazaar</a>
      <span><span id="who"></span> · <button class="btn btn-light" onclick="logout()">Log out</button></span>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <div>
        <h2 style="margin:0">Tractors posted by customers</h2>
        <span class="muted" id="count"></span>
      </div>
      <input id="search" type="search" placeholder="Search brand, model or location…">
    </div>
    <div class="grid" id="list"></div>
  </main>
  <div id="lightbox"><img alt=""></div>

  <script src="/common.js"></script>
  <script>
    let timer;

    async function load(q = '') {
      const { tractors } = await api(`/api/tractors?q=${encodeURIComponent(q)}`);
      document.getElementById('count').textContent = `${tractors.length} tractor${tractors.length === 1 ? '' : 's'}`;
      document.getElementById('list').innerHTML = tractors.length
        ? tractors.map((t) => tractorCard(t, { showContact: true })).join('')
        : '<p class="muted">No tractors found.</p>';
    }

    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => load(e.target.value), 300);
    });

    requireLogin('broker').then((user) => {
      document.getElementById('who').textContent = `Broker: ${user.name}`;
      load();
    });
  </script>
</body>
</html>
