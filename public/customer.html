<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tractors – TractorBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a href="/">🚜 TractorBazaar</a>
      <span><span id="who"></span> · <button class="btn btn-light" onclick="logout()">Log out</button></span>
    </div>
  </header>
  <main class="wrap layout">
    <form class="card" id="form">
      <h2 id="form-title">Post your tractor</h2>
      <div class="error" id="error"></div>
      <div class="row">
        <label>Brand <input name="brand" placeholder="e.g. Mahindra" required></label>
        <label>Model <input name="model" placeholder="e.g. 575 DI" required></label>
      </div>
      <div class="row">
        <label>Year <input name="year" type="number" min="1970" required></label>
        <label>Hours used <input name="hoursUsed" type="number" min="0"></label>
      </div>
      <div class="row">
        <label>Expected price (₹) <input name="expectedPrice" type="number" min="0" step="1000"></label>
        <label>Village / District <input name="location" required></label>
      </div>
      <label>Description <textarea name="description" rows="3" placeholder="Condition, documents, reason for selling…"></textarea></label>

      <div class="photo-section">
        <div class="angles-head">
          <strong>📸 Photos from every angle</strong>
          <span class="count" id="angle-count"></span>
        </div>
        <div class="progress"><div id="angle-progress"></div></div>
        <p class="muted hint">Tap a box to take or choose a photo. More angles help brokers trust your tractor.</p>
        <div class="slots" id="slots"></div>
        <div class="slots" id="extras"></div>
      </div>

      <button class="btn btn-primary btn-block" id="submit">Post tractor</button>
      <button type="button" class="btn btn-light btn-block" id="cancel" hidden>Cancel editing</button>
    </form>

    <section>
      <h2>My posted tractors</h2>
      <div class="grid" id="list"></div>
    </section>
  </main>
  <div id="lightbox"><img alt=""><p class="caption"></p></div>

  <script src="/common.js"></script>
  <script>
    const form = document.getElementById('form');
    const list = document.getElementById('list');
    const errorBox = document.getElementById('error');
    const slots = document.getElementById('slots');
    const extras = document.getElementById('extras');
    const submitButton = document.getElementById('submit');
    const FIELDS = ['brand', 'model', 'year', 'hoursUsed', 'expectedPrice', 'location', 'description'];

    let tractors = [];
    let editing = null; // the tractor being edited, or null when posting a new one
    const removed = new Set(); // ids of existing photos the customer removed while editing

    const CAMERA_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;

    slots.innerHTML = Object.entries(PHOTO_ANGLES).map(([angle, label], i) => `
      <div class="slot" data-angle="${angle}">
        ${i === 0 ? '<span class="cover-badge">COVER</span>' : ''}
        <label title="${label}">
          <input type="file" name="photo_${angle}" accept="image/jpeg,image/png,image/webp" hidden>
          <span class="slot-empty">${CAMERA_ICON}<b>${label}</b><small>Add photo</small></span>
          <img alt="${label}">
          <span class="slot-tag">${label}</span>
          <span class="slot-change">Change</span>
        </label>
        <button type="button" class="remove" title="Remove photo" aria-label="Remove ${label} photo">✕</button>
      </div>`).join('');

    const existingPhoto = (angle) => editing?.photos.find((p) => p.angle === angle && !removed.has(p.id));

    function renderPhotos() {
      let filled = 0;
      for (const slot of slots.children) {
        const file = slot.querySelector('input').files[0];
        const src = file ? URL.createObjectURL(file) : existingPhoto(slot.dataset.angle)?.url;
        const img = slot.querySelector('img');
        if (src) img.src = src; else img.removeAttribute('src');
        slot.classList.toggle('filled', !!src);
        if (src) filled++;
      }
      // Photos posted before angles existed don't fit a slot; list them so they can still be removed.
      const legacy = (editing?.photos ?? []).filter((p) => !(p.angle in PHOTO_ANGLES) && !removed.has(p.id));
      extras.innerHTML = legacy.map((p) => `
        <div class="slot filled">
          <label><img src="${p.url}" alt=""><span class="slot-tag">Earlier photo</span></label>
          <button type="button" class="remove" data-photo-id="${p.id}" title="Remove photo" aria-label="Remove photo">✕</button>
        </div>`).join('');
      const total = slots.children.length;
      document.getElementById('angle-count').textContent = filled === total ? '✓ All angles added' : `${filled} of ${total} angles`;
      document.getElementById('angle-progress').style.width = `${(filled / total) * 100}%`;
      return filled + legacy.length;
    }

    function resetForm() {
      form.reset();
      editing = null;
      removed.clear();
      errorBox.textContent = '';
      document.getElementById('form-title').textContent = 'Post your tractor';
      submitButton.textContent = 'Post tractor';
      document.getElementById('cancel').hidden = true;
      renderPhotos();
    }

    function startEdit(tractor) {
      resetForm();
      editing = tractor;
      for (const name of FIELDS) form.elements[name].value = tractor[name] ?? '';
      document.getElementById('form-title').textContent = `Edit ${tractor.brand} ${tractor.model}`;
      submitButton.textContent = 'Save changes';
      document.getElementById('cancel').hidden = false;
      renderPhotos();
      form.scrollIntoView({ behavior: 'smooth' });
    }

    async function load() {
      ({ tractors } = await api('/api/tractors/mine'));
      list.innerHTML = tractors.length
        ? tractors.map((t) => tractorCard(t, { ownerActions: true })).join('')
        : '<p class="muted">You have not posted any tractor yet.</p>';
    }

    slots.addEventListener('change', renderPhotos);

    form.addEventListener('click', (e) => {
      const button = e.target.closest('.remove');
      if (!button) return;
      if (button.dataset.photoId) {
        removed.add(Number(button.dataset.photoId));
      } else {
        const slot = button.closest('.slot');
        const input = slot.querySelector('input');
        if (input.files.length) input.value = ''; // drop the newly picked photo first
        else removed.add(existingPhoto(slot.dataset.angle).id);
      }
      renderPhotos();
    });

    document.getElementById('cancel').addEventListener('click', resetForm);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!renderPhotos()) {
        errorBox.textContent = 'Add at least one photo of the tractor';
        return;
      }
      const label = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = 'Uploading…';
      errorBox.textContent = '';
      const body = new FormData(form);
      for (const [name, value] of [...body]) if (value instanceof File && !value.name) body.delete(name); // empty slots
      try {
        if (editing) {
          body.set('removePhotoIds', [...removed].join(','));
          await api(`/api/tractors/${editing.id}`, { method: 'PUT', body });
        } else {
          await api('/api/tractors', { method: 'POST', body });
        }
        resetForm();
        await load();
      } catch (err) {
        errorBox.textContent = err.message;
      } finally {
        submitButton.disabled = false;
        if (submitButton.textContent === 'Uploading…') submitButton.textContent = label;
      }
    });

    list.addEventListener('click', async (e) => {
      const { edit, delete: del } = e.target.dataset;
      if (edit) return startEdit(tractors.find((t) => t.id === Number(edit)));
      if (!del || !confirm('Delete this post?')) return;
      await api(`/api/tractors/${del}`, { method: 'DELETE' });
      if (editing?.id === Number(del)) resetForm();
      await load();
    });

    requireLogin('customer').then((user) => {
      document.getElementById('who').textContent = `Customer: ${user.name}`;
      form.elements.year.max = new Date().getFullYear();
      renderPhotos();
      load();
    });
  </script>
</body>
</html>
