<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TractorBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="wrap"><a href="/">🚜 TractorBazaar</a></div></header>
  <main class="wrap">
    <div class="hero">
      <h1>Sell your used tractor to trusted brokers</h1>
      <p class="muted">Customers post photos of their tractor. Brokers see them and call you with an offer.</p>
    </div>
    <div class="choices">
      <div class="card">
        <div class="emoji">👨‍🌾</div>
        <h2>I'm a Customer</h2>
        <p class="muted">Post your tractor with photos</p>
        <a class="btn btn-primary" href="/login?role=customer">Customer Login</a>
        <a class="btn btn-light" href="/register?role=customer">Sign up</a>
      </div>
      <div class="card">
        <div class="emoji">🤝</div>
        <h2>I'm a Broker</h2>
        <p class="muted">Browse tractors posted by customers</p>
        <a class="btn btn-primary" href="/login?role=broker">Broker Login</a>
        <a class="btn btn-light" href="/register?role=broker">Sign up</a>
      </div>
    </div>
  </main>
</body>
</html>
