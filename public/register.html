<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up – TractorBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="wrap"><a href="/">🚜 TractorBazaar</a></div></header>
  <main class="wrap narrow">
    <form class="card" id="form">
      <h2 id="title">Sign up</h2>
      <div class="error" id="error"></div>
      <label>Full name <input name="name" required autofocus></label>
      <label>Mobile number <input name="phone" inputmode="numeric" maxlength="10" required></label>
      <label>Password <input name="password" type="password" minlength="6" required></label>
      <button class="btn btn-primary btn-block">Create account</button>
      <p class="muted">Already have an account? <a id="login" href="#">Log in</a></p>
    </form>
  </main>
  <script src="/common.js"></script>
  <script>
    const role = new URLSearchParams(location.search).get('role') === 'broker' ? 'broker' : 'customer';
    document.getElementById('title').textContent = role === 'broker' ? 'Broker Sign up' : 'Customer Sign up';
    document.getElementById('login').href = `/login?role=${role}`;

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await postJson('/api/auth/register', { name: f.get('name'), phone: f.get('phone'), password: f.get('password'), role });
        location.href = `/${role}`;
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
